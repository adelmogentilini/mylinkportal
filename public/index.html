<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-gray-100 min-h-screen">
  <div x-cloak x-data="portalApp()" class="min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800/50 backdrop-blur-md sticky top-0 z-40 border-b border-slate-700/50">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">
          Portal
        </h1>
        <p class="text-gray-400 text-sm">Navigate through your curated collection</p>
      </div>
    </header>

    <!-- Main content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Filters Section -->
      <div class="bg-slate-800/30 backdrop-blur-sm rounded-lg border border-slate-700/50 p-6 mb-8">
        <!-- Search -->
        <div class="mb-6">
          <input
            type="text"
            x-model="search"
            @input="filterLinks()"
            placeholder="Search links..."
            class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Filter tabs -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Categories -->
          <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Categories</label>
            <select x-model="selectedCategory" @change="filterLinks()" class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">All categories</option>
              <template x-for="cat in filters.categories" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
          </div>

          <!-- Sources -->
          <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Source</label>
            <select x-model="selectedSource" @change="filterLinks()" class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">All sources</option>
              <template x-for="src in filters.sources" :key="src">
                <option :value="src" x-text="src"></option>
              </template>
            </select>
          </div>

          <!-- Authors -->
          <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Author</label>
            <select x-model="selectedAuthor" @change="filterLinks()" class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">All authors</option>
              <template x-for="auth in filters.authors" :key="auth">
                <option :value="auth" x-text="auth"></option>
              </template>
            </select>
          </div>

          <!-- Tags -->
          <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Tags</label>
            <select x-model="selectedTag" @change="filterLinks()" class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">All tags</option>
              <template x-for="tag in filters.tags" :key="tag">
                <option :value="tag" x-text="tag"></option>
              </template>
            </select>
          </div>
        </div>

        <!-- Results count -->
        <div class="mt-4 text-sm text-gray-400">
          <span x-text="`${displayedLinks.length} link${displayedLinks.length !== 1 ? 's' : ''}`"></span>
          <template x-if="allLinks.length > displayedLinks.length">
            <span x-text="`out of ${allLinks.length}`"></span>
          </template>
        </div>
      </div>

      <!-- Links Grid -->
      <template x-if="displayedLinks.length > 0">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="link in displayedLinks" :key="link.id || link.url">
            <div class="bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-lg overflow-hidden hover:border-blue-500/50 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/10 flex flex-col">
              <!-- Card header with category -->
              <div class="px-6 py-4 border-b border-slate-700/50 bg-gradient-to-r from-slate-700/20 to-transparent">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex-1">
                    <h3 class="font-semibold text-lg text-white mb-2 line-clamp-2" x-text="link.title"></h3>
                    <p class="text-sm text-gray-400 line-clamp-2" x-text="link.description || 'No description'"></p>
                  </div>
                </div>
              </div>

              <!-- Card metadata -->
              <div class="px-6 py-3 text-sm space-y-2 flex-grow">
                <div class="flex flex-wrap gap-2">
                  <template x-if="link.category">
                    <span class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded text-xs font-medium" x-text="link.category"></span>
                  </template>
                  <template x-if="link.source">
                    <span class="px-2 py-1 bg-purple-500/20 text-purple-300 rounded text-xs font-medium" x-text="link.source"></span>
                  </template>
                </div>

                <template x-if="link.author">
                  <div class="text-gray-400 text-xs">
                    <span class="text-gray-500">Author:</span>
                    <span x-text="link.author"></span>
                  </div>
                </template>

                <template x-if="link.tags && link.tags.length > 0">
                  <div class="flex flex-wrap gap-1 pt-2">
                    <template x-for="tag in link.tags" :key="tag">
                      <span class="px-2 py-1 bg-slate-700/50 text-gray-300 rounded text-xs" x-text="`#${tag}`"></span>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Card footer with action -->
              <div class="px-6 py-4 border-t border-slate-700/50 flex gap-2">
                <a :href="link.url" target="_blank" rel="noopener noreferrer" class="flex-1 px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg font-medium text-center transition-all duration-200 hover:shadow-lg hover:shadow-blue-500/30">
                  Open
                </a>
                <button @click="copyToClipboard(link.url)" class="px-4 py-2 bg-slate-700/50 hover:bg-slate-600 text-gray-300 rounded-lg transition-colors duration-200">
                  Copy
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="displayedLinks.length === 0 && allLinks.length > 0">
        <div class="text-center py-16">
          <p class="text-gray-400 text-lg mb-4">No links match your filters</p>
          <button @click="resetFilters()" class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors duration-200">
            Reset filters
          </button>
        </div>
      </template>

      <!-- Initial empty state -->
      <template x-if="allLinks.length === 0">
        <div class="text-center py-16">
          <p class="text-gray-400 text-lg mb-4">No links found. Add some JSON files to the data folder!</p>
          <p class="text-gray-500 text-sm">Check the README for instructions.</p>
        </div>
      </template>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
