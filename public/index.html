<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-gray-100 min-h-screen">
  <div x-cloak x-data="portalApp()" class="min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800/50 backdrop-blur-md sticky top-0 z-40 border-b border-slate-700/50">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">
          Portal
        </h1>
        <p class="text-gray-400 text-sm">Navigate through your curated collection</p>
      </div>
    </header>

    <!-- Main content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Add Link Section -->
      <div class="bg-slate-800/30 backdrop-blur-sm rounded-lg border border-slate-700/50 p-4 mb-6">
        <form @submit.prevent="addLink()" class="flex flex-col md:flex-row gap-3">
          <input
            type="url"
            x-model="newLinkUrl"
            placeholder="Paste a link to add it..."
            required
            class="flex-1 px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
          />
          <input
            type="text"
            x-model="newLinkDescription"
            placeholder="Description (optional)"
            class="flex-1 px-4 py-2.5 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
          />
          <button
            type="submit"
            :disabled="adding"
            class="px-5 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:opacity-50 text-white rounded-lg font-medium text-sm transition-all duration-200 whitespace-nowrap"
            x-text="adding ? 'Adding...' : 'Add link'"
          ></button>
        </form>
      </div>

      <!-- Sidebar + list layout -->
      <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6 items-start">

        <!-- Sidebar -->
        <aside class="bg-slate-800/30 backdrop-blur-sm rounded-lg border border-slate-700/50 p-5 space-y-6 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto">
          <!-- Search -->
          <input
            type="text"
            x-model="search"
            @input="filterLinks()"
            placeholder="Search links..."
            class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          />

          <!-- Tags -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-3">Tags</h3>
            <div class="flex flex-wrap gap-2">
              <button
                @click="selectTag('')"
                :class="!selectedTag ? 'bg-purple-500 text-white' : 'bg-slate-700/50 text-gray-300 hover:bg-slate-600'"
                class="px-3 py-1.5 rounded-full text-xs font-medium transition-colors"
              >
                All <span class="opacity-70" x-text="`(${allLinks.length})`"></span>
              </button>
              <template x-for="t in tagCounts()" :key="t.name">
                <button
                  @click="selectTag(t.name)"
                  :class="selectedTag === t.name ? 'bg-purple-500 text-white' : 'bg-slate-700/50 text-gray-300 hover:bg-slate-600'"
                  class="px-2.5 py-1 rounded-full text-xs transition-colors"
                >
                  #<span x-text="t.name"></span> <span class="opacity-70" x-text="`(${t.count})`"></span>
                </button>
              </template>
            </div>
          </div>

          <template x-if="selectedTag || search">
            <button @click="resetFilters()" class="w-full px-3 py-2 bg-slate-700/50 hover:bg-slate-600 text-gray-300 rounded-lg text-sm transition-colors">
              Clear filters
            </button>
          </template>
        </aside>

        <!-- Link list -->
        <section class="min-w-0">
          <div class="flex items-center justify-between mb-4 text-sm text-gray-400">
            <span x-text="`${displayedLinks.length} link${displayedLinks.length !== 1 ? 's' : ''}`"></span>
            <template x-if="allLinks.length > displayedLinks.length">
              <span x-text="`out of ${allLinks.length}`"></span>
            </template>
          </div>

          <template x-if="displayedLinks.length > 0">
            <div class="space-y-8">
              <template x-for="group in groupedLinks()" :key="group.tag">
                <div>
                  <template x-if="!selectedTag">
                    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                      <span x-text="group.tag"></span>
                      <span class="text-gray-600 font-normal normal-case" x-text="`(${group.links.length})`"></span>
                    </h2>
                  </template>

                  <div class="divide-y divide-slate-700/40 bg-slate-800/30 rounded-lg border border-slate-700/50 overflow-hidden">
                    <template x-for="link in group.links" :key="link.id || link.url">
                      <div class="flex items-center gap-3 sm:gap-4 px-4 py-3 hover:bg-slate-700/30 transition-colors">
                        <span class="text-xl shrink-0" x-text="sourceIcon(link.tags)"></span>

                        <a :href="link.url" target="_blank" rel="noopener noreferrer" class="flex-1 min-w-0">
                          <div class="font-medium text-white truncate" x-text="link.title"></div>
                          <div class="text-xs text-gray-400 truncate" x-text="link.description || 'No description'"></div>
                        </a>

                        <div class="hidden md:flex flex-wrap gap-1 max-w-[220px] justify-end shrink-0">
                          <template x-for="tag in (link.tags || []).slice(0, 3)" :key="tag">
                            <span class="px-2 py-0.5 bg-slate-700/50 text-gray-400 rounded text-xs" x-text="`#${tag}`"></span>
                          </template>
                        </div>

                        <div class="flex items-center gap-1 shrink-0">
                          <button @click="copyToClipboard(link.url)" title="Copy link" class="p-2 text-gray-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">📋</button>
                          <button @click="editTitle(link.id)" title="Edit title" class="p-2 text-gray-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">📝</button>
                          <button @click="editDescription(link.id)" title="Edit description" class="p-2 text-gray-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">💬</button>
                          <button @click="swapTitleDescription(link.id)" title="Swap title/description" class="p-2 text-gray-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">⇄</button>
                          <button @click="editTags(link.id)" title="Edit tags" class="p-2 text-gray-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">🏷️</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Empty state -->
          <template x-if="displayedLinks.length === 0 && allLinks.length > 0">
            <div class="text-center py-16">
              <p class="text-gray-400 text-lg mb-4">No links match your filters</p>
              <button @click="resetFilters()" class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors duration-200">
                Reset filters
              </button>
            </div>
          </template>

          <!-- Initial empty state -->
          <template x-if="allLinks.length === 0">
            <div class="text-center py-16">
              <p class="text-gray-400 text-lg mb-4">No links found. Add some JSON files to the data folder!</p>
              <p class="text-gray-500 text-sm">Check the README for instructions.</p>
            </div>
          </template>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
